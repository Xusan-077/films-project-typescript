<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./main.css">
</head>

<body>

    <section>



        <div class="modal-div">
            <div class="delete-modal">
                <div class="delete-modal-content">
                    <div class="delete-modal-top">
                        <span class="delete-modal-top-title">
                            delete film
                        </span>
                        <span class="delete-modal-x-btn">&times;</span>
                    </div>
                    <div class="delete-modal-bottom">
                        <h3 class="delete-modal-title">
                            realy want to delete <span class="delete-modal-title-span">
                                ...
                            </span>
                        </h3>

                        <div class="delete-modal-btns-group">
                            <button class="delete">delete</button>
                            <button class="cancel">cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="top">

            <div class="sort-div">
                <form class="sort-form">
                    <label for="SortId">
                        Sort To First Letter
                    </label>
                    <select id="SortId" class="sort-select">
                        <option value="All">Default</option>
                        <option value="A-Z">A-Z</option>
                        <option value="Z-A">Z-A</option>
                    </select>
                    <button class="btn">filter</button>
                </form>
            </div>

            <div class="sort-from-genres-div">
                <form class="sort-from-genres-form">
                    <label for="SortId">
                        Sort To Genres
                    </label>
                    <select class="sort-from-genres-select">
                        <option value="All">All</option>
                    </select>
                    <button class="btn">filter</button>
                </form>
            </div>

            <div class="search-div">
                <form class="search-form">
                    <input type="text" class="search-input" placeholder="search...">
                    <button class="btn-search">search</button>
                </form>
                <button class="btn-voice">
                    <i class="bi bi-volume-up img"></i>
                    voice
                </button>
            </div>
        </div>


        <div class="container">
            <div class="bottom">
                <ul class="list"></ul>
            </div>
        </div>

    </section>

    <script src="./films.js"></script>
    <script src="./dist/index.js"></script>
</body>




</html>

</html>
